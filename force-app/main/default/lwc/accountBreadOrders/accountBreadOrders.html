<template>
  <lightning-card title="Bread Orders" icon-name="utility:checkout">
    <div class="slds-p-horizontal_medium">
      <lightning-tabset>
        <lightning-tab label="Ready for Delivery">
          <template lwc:if={hasReadyOrders}>
            <ul>
              <template for:each={ready} for:item="order">
                <li key={order.Id} class="slds-p-bottom_x-small">
                  {order.Bread__r.Name} x {order.Quantity__c}
                </li>
              </template>
            </ul>
            <div class="slds-text-align_center">
              <lightning-button 
                label="Deliver Bread Orders" 
                variant="brand" 
                onclick={goToDeliveries}>
              </lightning-button>
            </div>
          </template>
          <p lwc:else>No bread orders ready for delivery.</p>
        </lightning-tab>
        <lightning-tab label="Delivered">
          <ul lwc:if={hasDeliveredOrders}>
            <template for:each={delivered} for:item="order">
              <li key={order.Id} class="slds-p-bottom_x-small">
                {order.Bread__r.Name} x {order.Quantity__c}
              </li>
            </template>
          </ul>
          <p lwc:else>No bread orders delivered.</p>
        </lightning-tab>
        <lightning-tab label="Cancelled">
          <ul lwc:if={hasCancelledOrders}>
            <template for:each={cancelled} for:item="order">
              <li key={order.Id} class="slds-p-bottom_x-small">
                {order.Bread__r.Name} x {order.Quantity__c}
              </li>
            </template>
          </ul>
          <p lwc:else>No bread orders cancelled.</p>
        </lightning-tab>
      </lightning-tabset>
    </div>
  </lightning-card>    
</template>
