<template>
  <c-delivery-planner-grid>
    <span slot="select-accounts">
      <c-account-selector onselected={updateDeliveryPoints}></c-account-selector>
    </span>
    <span slot="calculate-route">
      <lightning-card hide-header label="Calculate Delivery Route">
        <div class="slds-m-around_medium">
          <div class="buttons">
            <lightning-button variant="brand" label="Calculate Delivery Route" disabled={disableButton} onclick={calculateDeliveryRoute}></lightning-button>
            <lightning-button variant="destructive-text" label="Reset" onclick={resetDeliveryRoute}></lightning-button>
          </div>
          <c-route-calculator coordinates={deliveryPoints}></c-route-calculator>
        </div>
      </lightning-card>
    </span>
    <span slot="account-details">
      <lightning-card hide-header label="View Bread Orders">
        <div class="slds-m-around_medium">
          <p>It's me!</p>
        </div>
      </lightning-card>
    </span>
  </c-delivery-planner-grid>
</template>
