<template>
  <c-delivery-planner-grid>
    <span slot="select-accounts">
      <c-delivery-planner-account-selector
        onselected={updateDeliveryPoints}
        selected-account-id={selectedAccountId}>
      </c-delivery-planner-account-selector>
    </span>
    <span slot="calculate-route">
      <lightning-card hide-header label="Calculate Delivery Route">
        <div class="slds-m-around_medium">
          <div class="buttons">
            <lightning-button variant="brand" label="Calculate Delivery Route" disabled={disableButton} onclick={calculateDeliveryRoute}></lightning-button>
            <lightning-button variant="destructive-text" label="Reset" onclick={resetDeliveryRoute}></lightning-button>
          </div>
          <c-delivery-planner-route-calculator deliveries={deliveryPoints} onvieworder={viewBreadOrder}></c-delivery-planner-route-calculator>
        </div>
      </lightning-card>
    </span>
    <span slot="account-details">
      <c-delivery-planner-bread-orders></c-delivery-planner-bread-orders>
    </span>
  </c-delivery-planner-grid>
</template>
