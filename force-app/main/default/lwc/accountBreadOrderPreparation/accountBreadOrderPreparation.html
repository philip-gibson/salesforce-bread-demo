<template>
  <lightning-card title="Bread Orders - In Progress" icon-name="utility:breadcrumbs">
    <lightning-button-group slot="actions">
      <lightning-button label="Ready for Delivery" disabled={disabled} onclick={readyForDelivery}></lightning-button>
      <lightning-button label="Cancel" variant="destructive" icon-name="utility:delete" disabled={disabled} onclick={cancelled}></lightning-button>
    </lightning-button-group>
    <div class="slds-p-horizontal_medium">
      <template lwc:if={hasOrders}>
        <ul class="slds-p-top_xx-small">
          <template for:each={newBreadOrders} for:item="order">
            <li key={order.id} class="slds-p-bottom_x-small">
              <div class="slds-grid slds-grid_align-spread">
                <p>{order.name} x {order.quantity}</p>
                <lightning-button-icon-stateful icon-name="utility:check" size="small" onclick={handleClick} alternative-text={order.name} data-order-id={order.id} selected={order.selected}></lightning-button-icon-stateful>
              </div>
            </li>
          </template>
        </ul>
      </template>
      <p lwc:else>No new bread orders.</p>
    </div>
  </lightning-card>
</template>
