<template>
    <lightning-card title="Bread Order Maker" icon-name="utility:add">
      <div class="slds-p-horizontal_medium">
        <div class="order-maker">
          <lightning-combobox
            class="bread-selector"
            label="Select type of Bread"
            placeholder="Select..."
            value={selectedBread}
            options={options}
            onblur={handleBlurBread}
            onchange={handleChangeBread}>
          </lightning-combobox>
          <lightning-input
            class="quantity-input"
            type="number"
            label="Quantity"
            value={quantity}
            onblur={handleBlurQuantity}
            onchange={handleChangeQuantity}></lightning-input>
        </div>
        <div class="buttons slds-m-vertical_medium">
          <lightning-button label="Create Order" onclick={handleOrder}></lightning-button>
          <lightning-button variant="base" label="Reset" onclick={handleReset}></lightning-button>
        </div>
      </div>
    </lightning-card>
</template>
