<template>
    <lightning-card title="Bread Order" icon-name="utility:add">
      <lightning-button variant="base" label="Reset" onclick={handleReset} slot="actions"></lightning-button>
      <lightning-button class="slds-m-left_medium" label="Create Order" onclick={handleOrder} slot="actions"></lightning-button>
      <div class="slds-p-horizontal_medium slds-m-bottom_medium">
        <div class="order-maker">
          <lightning-combobox
            class="bread-selector"
            label="Select type of Bread"
            placeholder="Select..."
            value={selectedBread}
            options={options}
            onblur={handleBlurBread}
            onchange={handleChangeBread}>
          </lightning-combobox>
          <lightning-input
            class="quantity-input"
            type="number"
            label="Quantity"
            value={quantity}
            onblur={handleBlurQuantity}
            onchange={handleChangeQuantity}></lightning-input>
        </div>
      </div>
    </lightning-card>
</template>
