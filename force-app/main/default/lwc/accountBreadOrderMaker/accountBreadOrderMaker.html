<template>
    <lightning-card title="Bread Order" icon-name="utility:add">
      <lightning-button-group slot="actions">
        <lightning-button label="Create Order" onclick={handleOrder}></lightning-button>
        <lightning-button label="Reset" onclick={handleReset}></lightning-button>
      </lightning-button-group>
      <div class="slds-p-horizontal_medium slds-m-bottom_medium">
        <div class="order-maker">
          <lightning-combobox
            class="bread-selector"
            label="Select type of Bread"
            placeholder="Select..."
            value={selectedBread}
            options={options}
            onblur={handleBlurBread}
            onchange={handleChangeBread}>
          </lightning-combobox>
          <lightning-input
            class="quantity-input"
            type="number"
            label="Quantity"
            value={quantity}
            onblur={handleBlurQuantity}
            onchange={handleChangeQuantity}></lightning-input>
        </div>
      </div>
    </lightning-card>
</template>
