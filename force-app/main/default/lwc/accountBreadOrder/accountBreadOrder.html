<template>
  <lightning-card hide-header label="View Bread Orders">
    <div class="slds-m-around_medium">
      <div class="header">
        <h3 class="header-text">Bread Orders for Delivery</h3>
      </div>
      <template lwc:if={isLoading}>
        <div class="slds-is-relative slds-p-vertical_large">
          <lightning-spinner
            alternative-text="Loading bread orders"
            size="small"
          ></lightning-spinner>
        </div>
      </template>
      <template lwc:elseif={hasOrders}>
        <p class="account-name">{accountName}</p>
        <ul>
          <template for:each={accountBreadOrders} for:item="order">
            <li key={order.Id} class="slds-p-bottom_x-small">
              {order.Bread__r.Name} x {order.Quantity__c}
            </li>
          </template>
        </ul>
        <hr class="slds-m-vertical_medium" />
        <p class="total">Total: ${total}</p>
      </template>
      <p lwc:else>Click account to view bread orders for delivery.</p>
    </div>
  </lightning-card>
</template>
